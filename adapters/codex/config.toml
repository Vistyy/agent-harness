[features]
multi_agent = true

[agents.explorer]
description = "Default for bounded read-only repository discovery when the parent would otherwise read broad file sets, map call paths, or compress context. Standing AGENTS.md authorization applies; do not ask the user again. Give it a concrete question; it returns relevant files/symbols/relationships/open questions without proposing fixes by default."
config_file = "agents/explorer.toml"

[agents.planning_critic]
description = "Strategy reviewer before non-trivial execution or scope expansion. Standing AGENTS.md authorization applies; do not ask the user again. Challenges whether the proposed route/end state should exist and whether it is the simplest correct shape for the binding objective without implementing."
config_file = "agents/planning-critic.toml"

[agents.implementer]
description = "Default for non-trivial bounded code/doc edits once objective coverage, target shape, evidence strategy, and owned scope are clear. Standing AGENTS.md authorization applies; do not ask the user again. Edits only owned files, verifies locally, and never approves its own work."
config_file = "agents/implementer.toml"

[agents.quality_guard]
description = "Early ruthless code-quality gate after a non-trivial implementation has a direction or draft diff, before bugs, drift, unreadable code, or bad structure compound. Standing AGENTS.md authorization applies; do not ask again. Blocks continuation on current-scope correctness, quality, objective, proof, or owner defects without final approval authority."
config_file = "agents/quality-guard.toml"

[agents.final_reviewer]
description = "Use only for final isolated merge-readiness review after implementation and local verification. Standing AGENTS.md authorization applies; do not ask the user again. Judges the whole changed surface against bugs, implementation quality, binding objective, proof validity, cleanup, residual work, and repo health."
config_file = "agents/final-reviewer.toml"

[agents.runtime_evidence]
description = "Use when verify-work requires independent live-use proof for non-trivial runtime-visible behavior. Standing AGENTS.md authorization applies; do not ask the user again. It exercises the app/service/API/operator path, records artifacts, and returns pass/reject/blocked for observed behavior only."
config_file = "agents/runtime-evidence.toml"

[agents.design_judge]
description = "Use for broad product-facing UI visual-quality approval after screenshot/contact-sheet artifacts exist. Standing AGENTS.md authorization applies; do not ask the user again. Rejects broken, incoherent, inaccessible, or non-shippable UI."
config_file = "agents/design-judge.toml"
